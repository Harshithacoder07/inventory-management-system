<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rama's Professional IMS</title>
    <style>
        /* CSS: This makes the website look professional */
        :root {
            --dark: #2c3e50;
            --blue: #3498db;
            --green: #27ae60;
            --red: #e74c3c;
            --gray: #ecf0f1;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; background: #f4f4f4; }
        
        /* Sidebar Navigation */
        .sidebar { width: 220px; height: 100vh; background: var(--dark); color: white; position: fixed; }
        .sidebar h2 { padding: 20px; font-size: 1.2rem; border-bottom: 1px solid #34495e; margin: 0; }
        .nav-link { padding: 15px 20px; cursor: pointer; display: block; transition: 0.3s; border-bottom: 1px solid #34495e; }
        .nav-link:hover { background: var(--blue); }
        .active-link { background: var(--blue); }

        /* Main Content Area */
        .content { margin-left: 220px; padding: 30px; width: 100%; }
        .page { display: none; } /* Hide all pages by default */
        .active-page { display: block; } /* Show only the active page */

        /* Dashboard Cards */
        .stats-container { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 8px; flex: 1; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 5px solid var(--blue); }
        
        /* Forms and Tables */
        .input-section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        input { padding: 10px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; width: 200px; }
        button { padding: 10px 20px; background: var(--green); color: white; border: none; border-radius: 4px; cursor: pointer; }
        button.delete { background: var(--red); }

        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; color: var(--dark); }
        .low-stock { color: var(--red); font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>IMS ADMIN</h2>
        <div class="nav-link active-link" onclick="showPage('dash', this)">Dashboard</div>
        <div class="nav-link" onclick="showPage('inv', this)">Inventory</div>
        <div class="nav-link" onclick="showPage('sup', this)">Suppliers</div>
    </div>

    <div class="content">
        
        <div id="dash" class="page active-page">
            <h1>Business Overview</h1>
            <div class="stats-container">
                <div class="card"><h3>Total Value</h3><h2 id="stat-value">$0.00</h2></div>
                <div class="card"><h3>Items in Stock</h3><h2 id="stat-count">0</h2></div>
                <div class="card" style="border-top-color: var(--red);"><h3>Low Stock Alerts</h3><h2 id="stat-low">0</h2></div>
            </div>
        </div>

        <div id="inv" class="page">
            <h1>Stock Management</h1>
            <div class="input-section">
                <h3>Add New Product</h3>
                <input type="text" id="pName" placeholder="Product Name">
                <input type="number" id="pPrice" placeholder="Price ($)">
                <input type="number" id="pQty" placeholder="Quantity">
                <button onclick="addProduct()">Add to Inventory</button>
            </div>
            <table>
                <thead>
                    <tr><th>Product</th><th>Price</th><th>Quantity</th><th>Status</th><th>Action</th></tr>
                </thead>
                <tbody id="inventory-list"></tbody>
            </table>
        </div>

        <div id="sup" class="page">
            <h1>Suppliers List</h1>
            <div class="input-section">
                <input type="text" id="sName" placeholder="Supplier Name">
                <input type="text" id="sContact" placeholder="Contact Detail">
                <button onclick="addSupplier()">Add Supplier</button>
            </div>
            <table>
                <thead>
                    <tr><th>Supplier Name</th><th>Contact</th><th>Action</th></tr>
                </thead>
                <tbody id="supplier-list"></tbody>
            </table>
        </div>

    </div>

    <script>
        /* JAVASCRIPT: The "Engine" of your website */
        
        // Data Arrays (Simulating a Database)
        let inventory = JSON.parse(localStorage.getItem('rama_inv')) || [];
        let suppliers = JSON.parse(localStorage.getItem('rama_sup')) || [];

        // 1. Navigation Logic
        function showPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-link'));
            
            document.getElementById(pageId).classList.add('active-page');
            element.classList.add('active-link');
            updateDashboard();
        }

        // 2. Inventory Logic
        function addProduct() {
            const name = document.getElementById('pName').value;
            const price = parseFloat(document.getElementById('pPrice').value);
            const qty = parseInt(document.getElementById('pQty').value);

            if(name && price && qty) {
                inventory.push({ id: Date.now(), name, price, qty });
                saveData();
                renderInventory();
                // Clear inputs
                document.getElementById('pName').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pQty').value = '';
            } else { alert("Please fill all boxes!"); }
        }

        function deleteProduct(id) {
            inventory = inventory.filter(item => item.id !== id);
            saveData();
            renderInventory();
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '';
            inventory.forEach(item => {
                const status = item.qty < 5 ? '<span class="low-stock">REORDER!</span>' : 'OK';
                list.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td>$${item.price.toFixed(2)}</td>
                        <td>${item.qty}</td>
                        <td>${status}</td>
                        <td><button class="delete" onclick="deleteProduct(${item.id})">Remove</button></td>
                    </tr>`;
            });
        }

        // 3. Supplier Logic
        function addSupplier() {
            const name = document.getElementById('sName').value;
            const contact = document.getElementById('sContact').value;
            if(name && contact) {
                suppliers.push({ id: Date.now(), name, contact });
                saveData();
                renderSuppliers();
                document.getElementById('sName').value = '';
                document.getElementById('sContact').value = '';
            }
        }

        function renderSuppliers() {
            const list = document.getElementById('supplier-list');
            list.innerHTML = '';
            suppliers.forEach(s => {
                list.innerHTML += `<tr><td>${s.name}</td><td>${s.contact}</td><td><button class="delete" onclick="deleteSupplier(${s.id})">Remove</button></td></tr>`;
            });
        }

        function deleteSupplier(id) {
            suppliers = suppliers.filter(s => s.id !== id);
            saveData();
            renderSuppliers();
        }

        // 4. Data Persistence (Save to Browser Memory)
        function saveData() {
            localStorage.setItem('rama_inv', JSON.stringify(inventory));
            localStorage.setItem('rama_sup', JSON.stringify(suppliers));
            updateDashboard();
        }

        function updateDashboard() {
            const totalVal = inventory.reduce((acc, i) => acc + (i.price * i.qty), 0);
            const totalCount = inventory.reduce((acc, i) => acc + i.qty, 0);
            const lowItems = inventory.filter(i => i.qty < 5).length;

            document.getElementById('stat-value').innerText = '$' + totalVal.toFixed(2);
            document.getElementById('stat-count').innerText = totalCount;
            document.getElementById('stat-low').innerText = lowItems;
        }

        // Run on start
        renderInventory();
        renderSuppliers();
        updateDashboard();
    </script>
</body>
</html>
